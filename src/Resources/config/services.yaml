services:
    _defaults:
        autowire: true
        autoconfigure: true

    Lle\ConfigBundle\:
        resource: '../../'
        # the credential warmup is registered by LleConfigExtension, only when the credential bundle is installed
        exclude:
            - '../../Dto/'
            - '../../Security/ConfigCredentialWarmup.php'

    Lle\ConfigBundle\Twig\ConfigExtension:
        arguments:
            - '@doctrine.orm.entity_manager'
        tags: [twig.extension]

    Lle\ConfigBundle\Crudit\Datasource\ConfigDatasource:
        arguments:
            $tenantService: '@?lle_config.tenant_service'

