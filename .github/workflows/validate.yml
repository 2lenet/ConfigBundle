name: Validate

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    php-coding-standard:
        name: "PHP Coding Standard ${{ matrix.php-version }}"

        runs-on: ubuntu-latest
        strategy:
            matrix:
                php_version: [8.4]

        steps:
            -   uses: actions/checkout@v2

            -   name: 'Validate composer.json and composer.lock'
                run: composer validate

            -   name: 'Cache Composer packages'
                id: composer-cache
                uses: actions/cache@v4
                with:
                    path: vendor
                    key: ${{ runner.os }}-php-${{ matrix.php_version }}-${{ hashFiles('**/composer.json') }}
                    restore-keys: |
                        ${{ runner.os }}-php-${{ matrix.php_version }}-

            -   name: 'Install dependencies with Composer'
                uses: php-actions/composer@v5
                with:
                    php_version: ${{ matrix.php_version }}
                    version: 2
                    args: --profile

            -   name: 'PHP CodeSniffer Validations'
                run: vendor/bin/phpcs

            -   name: 'PHPStan Static Analysis'
                run: vendor/bin/phpstan analyse -c tests/phpstan.neon
